<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>《易经》是什么？· 问题导向的知识卡片</title>
<style>
:root{
  --paper:#f7f1e3; --paper2:#efe6cf; --ink:#2b231a; --sub:#7a6a55;
  --line:#e4d8bf; --cinnabar:#b03a2e; --cinnabar2:#8f2f24;
  --gold:#b8923a; --gold-soft:#f3e6c4;
  --e:#b03a2e; --p:#8f6a1e; --i:#2e6b5c; --c:#4a3f7a;
  --radius:16px;
  --shadow:0 1px 3px rgba(60,45,20,.08),0 4px 16px rgba(60,45,20,.06);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 15% 10%, rgba(184,146,58,.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(176,58,46,.04), transparent 40%);
}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 120px}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(247,241,227,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand .tri{font-size:22px;color:var(--cinnabar)}
.brand h1{font-family:var(--serif);font-size:21px;margin:0;letter-spacing:1px;font-weight:800}
.brand .en{font-size:12px;color:var(--sub);letter-spacing:2px}
header .sub{font-size:12.5px;color:var(--sub);margin:4px 0 10px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);background:#fbf6ea;
  color:var(--sub);padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap}
.nav a.on{background:var(--ink);border-color:var(--ink);color:#f7f1e3;font-weight:600}
.nav a.refs{color:var(--cinnabar);border-color:#e2c9c3;background:#fbf1ef}

/* hero */
.hero{text-align:center;padding:34px 8px 10px}
.hero .bagua{font-size:40px;letter-spacing:6px;color:var(--gold);margin-bottom:8px}
.hero h2{font-family:var(--serif);font-size:28px;margin:0 0 10px;letter-spacing:2px}
.hero p.lead{font-size:15px;color:var(--sub);max-width:560px;margin:0 auto 22px}
.epic-line{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 6px}
.epic-chip{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 12px;
  font-size:13px;font-weight:700;color:#fff;box-shadow:var(--shadow)}
.epic-chip b{font-size:17px}
.epic-flow{font-size:12px;color:var(--sub);margin-top:10px}

/* act section */
.act{margin-top:34px}
.act-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:14px 16px;
  border-radius:var(--radius);color:#fff;box-shadow:var(--shadow)}
.act-head .glyph{font-size:30px;line-height:1}
.act-head .meta b{display:block;font-size:19px;font-family:var(--serif);letter-spacing:1px}
.act-head .meta .en{font-size:11px;opacity:.85;letter-spacing:2px}
.act-head .tagline{margin-left:auto;font-size:13px;font-weight:600;opacity:.95;
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 12px}

/* dig card */
.dig{background:#fffdf6;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.dig-top{padding:18px 18px 14px}
.dig-top .qno{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.dig-top .qno .bar{display:inline-block;width:26px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}
.dig-top .q{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.5;margin:0 0 8px}
.dig-top .hint{font-size:13.5px;color:var(--sub);font-style:italic;margin:0}
.dig-top .hint::before{content:"💭 ";font-style:normal}
.dig-btn{display:block;width:calc(100% - 36px);margin:0 18px 16px;padding:12px;border:1px dashed var(--gold);
  background:var(--gold-soft);color:#7a5a1a;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer}
.dig-btn:hover{background:#eeda9e}
.dig-btn[disabled]{opacity:.5;cursor:default}

/* layers */
.layers{padding:0 18px}
.layer{display:none;margin-bottom:12px;padding:14px 16px;border-radius:12px;background:#faf6ec;
  border:1px solid var(--line);border-left:4px solid var(--gold);animation:fade .4s ease}
.layer.show{display:block}
.layer.depth1{border-left-color:#d9b86a}
.layer.depth2{border-left-color:#c9973a}
.layer.depth3{border-left-color:var(--cinnabar);background:#fbf0ec;border-color:#e8d3ca}
.layer .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
  letter-spacing:1px;margin-bottom:7px}
.layer .lbl .dot{width:9px;height:9px;border-radius:50%}
.layer.depth1 .lbl{color:#8a6a1f}.layer.depth1 .dot{background:#d9b86a}
.layer.depth2 .lbl{color:#a8781d}.layer.depth2 .dot{background:#c9973a}
.layer.depth3 .lbl{color:var(--cinnabar)}.layer.depth3 .dot{background:var(--cinnabar)}
.layer p{margin:0;font-size:14.5px;color:#3a2f22;text-align:justify}
.layer p b{color:var(--ink)}
.layer .refs{margin-top:9px;font-size:12.5px;color:var(--sub)}
.layer .refs a{color:var(--cinnabar);text-decoration:none;margin-right:3px}
.layer .refs a:hover{text-decoration:underline}
.dig-next{display:block;width:calc(100% - 36px);margin:0 18px 16px;padding:11px;border:1px solid var(--line);
  background:#fff;color:var(--ink);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.dig-next:hover{border-color:var(--gold)}
.dig-next[disabled]{display:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* references */
.refs-sec{margin-top:40px}
.refs-sec h2{font-family:var(--serif);font-size:22px;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;margin:0 0 6px}
.refs-sec .note{font-size:12.5px;color:var(--sub);margin:0 0 16px}
.refs-sec ol{margin:0;padding:0;list-style:none}
.refs-sec li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:13px;color:#4a3d2c;line-height:1.6}
.refs-sec li:last-child{border-bottom:none}
.refs-sec .rid{color:var(--cinnabar);font-weight:700;font-size:12px;flex-shrink:0;min-width:26px}
.refs-sec li .cite{word-break:break-word}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:40px;line-height:1.8}
@media(min-width:600px){.dig-top .q{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <span class="tri">☯</span>
    <h1 id="h1"></h1>
  </div>
  <p class="sub" id="hsub"></p>
  <div class="nav" id="nav"></div>
</header>

<div class="hero">
  <div class="bagua" id="bagua"></div>
  <h2 id="heroTitle"></h2>
  <p class="lead" id="heroLead"></p>
  <div class="epic-line" id="epicChips"></div>
  <div class="epic-flow" id="epicFlow"></div>
</div>

<div id="acts"></div>

<section class="refs-sec" id="refsSec">
  <h2 id="refsTitle"></h2>
  <p class="note" id="refsNote"></p>
  <ol id="refsList"></ol>
</section>

<div class="foot" id="foot"></div>
</div>

<script>
const DATA = {"title": "《易经》是什么？", "subtitle": "问题导向的知识卡片 · 用 E-P-I-C 认知链条，层层追问一本三千年的古经", "hero": {"bagua": "☰ ☱ ☲ ☳ ☴ ☵ ☶ ☷", "title": "不给你一个答案，只带你一路追问", "lead": "《易经》——一本诞生于三千年前的“占卜之书”，却被历代尊为“群经之首”，影响了中国的哲学、科学、艺术与管理，乃至莱布尼茨、荣格、黑塞、歌德。它，到底是什么？", "flow": "每一张卡片都是一次追问，每点一下“再深一层”，就离“是什么”的本质更近一步。"}, "acts": [{"key": "E", "name": "本质洞察", "en": "Essence Insight", "tagline": "寻找张力", "glyph": "☲", "color": "#b03a2e", "questions": [{"q": "《易经》究竟是一本什么样的书？", "hint": "它摆在书店的哪个位置——哲学架，还是占卜架？", "layers": [{"label": "第一层 · 是什么", "text": "《易经》最初是一本占筮（卜卦）之书。全书以六十四卦为骨架，每卦有卦画、卦名、卦辞，每卦六爻各有爻辞，构成一套用于“决嫌疑、定吉凶”的符号—文字系统。学界通常认为它由西周的巫史在长期占筮实践中逐步编纂而成，属于上古“数字卦”占卜传统的文字化结晶。", "refs": [1, 2]}, {"label": "第二层 · 为什么", "text": "但它绝不止于占卜。卦爻辞里沉淀了殷周之际先民对自然、人事、伦理的观察与判断——天象、农事、征伐、婚嫁、饮食、诚信、忧患，无所不包。所以它又常被称为一部“以占筮为外壳的百科全书”，是观察先民生活与观念的一扇窗。", "refs": [3, 2]}, {"label": "第三层 · 凭什么（本质）", "text": "这恰恰是《易经》最根本的张力所在：一部用来“问神”的占卜书，如何变成了中国人“问己”的智慧之源？从“鬼谋”到“人谋”、从“巫术”到“哲学”的转变，正是理解《易经》全部价值的那把钥匙。", "refs": [4, 5]}]}, {"q": "《易经》和《周易》是同一本书吗？", "hint": "两个名字混用了两千年，其实暗藏玄机。", "layers": [{"label": "第一层 · 是什么", "text": "通常说的“周易”，指《周易》古经——即《易经》本文：六十四卦卦画与卦爻辞。而广义的《周易》，还包括后来解释古经的《易传》（“十翼”）十篇：彖、象、系辞、文言、说卦、序卦、杂卦等。古人合称“经传”。", "refs": [6, 7]}, {"label": "第二层 · 为什么", "text": "“易”与“周易”之“周”，历来有“周代”与“周遍（无所不包）”两说；“易”则兼有变易、简易、不易三义。书名之争的背后，是古人对这部书性质与归属的不同定位，也是训诂学上一个争讼不休的公案。", "refs": [8, 9]}, {"label": "第三层 · 凭什么（本质）", "text": "区分“经”与“传”极其关键：古经是西周占筮遗存，文字古奥；《易传》是战国以降哲人的解释与提升，把占卜系统升华为一套宇宙论与人生哲学。没有《易传》，就没有我们今天理解的“易学”。", "refs": [10, 11]}]}, {"q": "一本“占卜书”，凭什么被尊为“群经之首”？", "hint": "这是全书最大的悬念——占卜如何登堂入室？", "layers": [{"label": "第一层 · 是什么", "text": "汉代以后，《易经》位列“五经”（易、书、诗、礼、春秋）之首，成为儒家经典的核心。这个“首”既是目录学顺序，更是一种价值排序——它被认为提供了其余诸经所欠缺的形上根基。", "refs": [12, 13]}, {"label": "第二层 · 为什么", "text": "因为《易经》回答的是“天地人”之总原理：一阴一阳之谓道。它用符号化的方式，给出了一个关于世界如何生成、变化、运行的宇宙论框架。相较之下，《诗》《书》《礼》偏于具体制度与情感，而《易》触及了“道”本身。", "refs": [14, 15]}, {"label": "第三层 · 凭什么（本质）", "text": "更深一层，《易经》的“首”地位，来自它把占筮的偶然性转成了宇宙的必然性：卦象不是神谕，而是世界结构的符号映照。于是读《易》不再是问吉凶，而是明变化、知进退、修德行——它从“术”升格为“道”。", "refs": [16, 17]}]}, {"q": "它是“自然宗教”，还是“伦理宗教”？——神在哪里？", "hint": "一本“通神”的书，却几乎不讨论神。", "layers": [{"label": "第一层 · 是什么", "text": "《易经》保留了占筮传统对“天”“帝”“鬼神”的敬畏，卦爻辞中确有“自天祐之”“帝”等语，带有原始宗教与自然崇拜的痕迹。它确实没有完全斩断与“神”的联系。", "refs": [18, 19]}, {"label": "第二层 · 为什么", "text": "但它的重心，早已从“讨好神明”转向“修德以配天”。卦爻辞反复强调“君子”“谦”“孚（诚信）”“悔吝”“无咎”——吉凶的根据，从神的意志，逐步转为人的德行与时机。", "refs": [20, 21]}, {"label": "第三层 · 凭什么（本质）", "text": "于是有学者判定：《易经》走的是一条“从原始宗教到人文宗教”的路——神不再人格化地干涉人事，而是退隐为一种“超越的根据”，人的主体性被空前张扬。这正是中国思想“人文精神”早熟的一个源头。", "refs": [22, 23]}]}]}, {"key": "P", "name": "模式提炼", "en": "Pattern Refinement", "tagline": "锻造概念", "glyph": "☰", "color": "#8f6a1e", "questions": [{"q": "《易经》的核心“概念模型”是什么？", "hint": "抛开文字，它首先是一套“符号”。", "layers": [{"label": "第一层 · 是什么", "text": "《易经》的核心模型，是一套二元—生成—结构化的符号系统：由“阴阳”两爻（—、--）叠成八卦（乾☰、坤☷、震☳、巽☴、坎☵、离☲、艮☶、兑☱），再由八卦两两相重，生成六十四卦、三百八十四爻。", "refs": [24, 25]}, {"label": "第二层 · 为什么", "text": "这套模型的价值在于它的生成性：“太极生两仪，两仪生四象，四象生八卦”，八卦相荡而万物出。它不是静止的分类表，而是一个可以不断自我衍生的形式系统——用最少的符号，覆盖无限的世界。", "refs": [26, 27]}, {"label": "第三层 · 凭什么（本质）", "text": "这正是《易经》作为“概念模型”最了不起的地方：它把“变化”本身当作世界的第一原理来建模。别的经典告诉你世界“是什么”，《易经》告诉你世界“如何变”——它是中国古代最纯粹的一套“生成论”模型。", "refs": [28, 29]}]}, {"q": "“易”有哪三个含义？——变易、不易、简易", "hint": "一个“易”字，其实藏着一套世界观。", "layers": [{"label": "第一层 · 是什么", "text": "东汉郑玄总结“易”有三义：变易（世界无时不在变化）、不易（变化背后的规律恒常不变）、简易（这套规律可以化为极简的符号与原则）。", "refs": [8, 9]}, {"label": "第二层 · 为什么", "text": "“变易”与“不易”看似矛盾，实则一体两面：现象层面万物流变，本体层面“易简之理”恒定。所谓“易简而天下之理得矣”——最深刻的道理，恰恰能用最简单的方式表达。", "refs": [8]}, {"label": "第三层 · 凭什么（本质）", "text": "这“三易”构成了一种动态平衡的宇宙观：既承认流变，又相信规律；既直面无常，又追求简明。它塑造了中国人“以不变应万变”“执简御繁”的思维气质，与西方“追求确定、本质静止”的古典本体论形成鲜明对照。", "refs": [30, 31]}]}, {"q": "“象数”与“义理”——两条诠释路线在争什么？", "hint": "两千年的易学史，可以看成这两派的分合史。", "layers": [{"label": "第一层 · 是什么", "text": "易学内部长期分为两大进路：象数派重卦象、爻位、数字与卜筮技术（如汉代京房、宋代邵雍）；义理派重卦爻辞背后的哲理与人事（如王弼、程颐）。一个“观象”，一个“明理”。", "refs": [11, 32]}, {"label": "第二层 · 为什么", "text": "两派之争的本质，是《易经》的双重身份——它既是一套占筮的操作技术（象数），又是一套思想的文本载体（义理）。重象数则《易》近“术”，重义理则《易》近“学”。", "refs": [33, 34]}, {"label": "第三层 · 凭什么（本质）", "text": "而《易经》的真正魅力，恰恰在于它“象—辞—意”三位一体：象是符号，辞是文字，意是哲理，三者层层相扣。割裂任何一层，都会读薄了它。象数义理之争，本质上都在回答同一个问题——符号如何承载意义？", "refs": [35, 36]}]}, {"q": "从“数字卦”到“卦爻辞”——这个模型是如何被锻造出来的？", "hint": "考古发现改写了《易经》的“出生证明”。", "layers": [{"label": "第一层 · 是什么", "text": "20世纪以来的考古发现——殷周甲骨、青铜器上的“数字卦”，以及长沙马王堆帛书《周易》、上海博物馆战国楚竹书《周易》——让学界得以重建《易经》文本的生成过程。", "refs": [1, 37]}, {"label": "第二层 · 为什么", "text": "《易经》并非一人一时之作，而是经历了一个漫长的“锻造”过程：先是数字占筮（六、七、八、九等数字符号），后演变为阴阳爻画；卦画配以卦名，再系以卦辞、爻辞，经西周至战国才逐步定型。", "refs": [38, 37]}, {"label": "第三层 · 凭什么（本质）", "text": "这意味着《易经》是一个“活的文本”——它没有“原稿”，只有不断层累、选择、修饰的“编成史”。帛书、竹书与今本的差异（如卦序不同、异文甚多），恰恰证明了它如何在历史中被反复“重写”，最终凝定为经典。", "refs": [39, 40]}]}]}, {"key": "I", "name": "意涵衍生", "en": "Implication Derivation", "tagline": "情景推演", "glyph": "☴", "color": "#2e6b5c", "questions": [{"q": "《易经》是“辩证法”吗？——它如何解释“变化”？", "hint": "有人把它捧成“中国古代辩证法”，也有人反对。", "layers": [{"label": "第一层 · 是什么", "text": "《易经》确实充满对立统一的范畴：阴阳、刚柔、乾坤、泰否、吉凶、悔吝。它认为一切现象都处在“物极必反”“否极泰来”的转化之中。", "refs": [41, 42]}, {"label": "第二层 · 为什么", "text": "但《易经》的变化观与黑格尔式辩证法有根本不同：它不追求“正—反—合”的线性扬弃，而强调循环往复、消长盈虚（如“复”卦讲一阳来复、“剥”极而复）。变化不是直线进步，而是阴阳消息的节律。", "refs": [41, 30]}, {"label": "第三层 · 凭什么（本质）", "text": "所以《易经》提供的是一种“节律—时机”的智慧：关键不在于“要不要变”，而在于“何时变、变到何种程度”——“知进退存亡而不失其正”。这是一种比“斗争哲学”更早熟、更圆融的“变易之道”。", "refs": [43, 44]}]}, {"q": "莱布尼茨的二进制，真的源于《易经》吗？——它如何进入科学？", "hint": "一个流传极广的传说，真相更微妙。", "layers": [{"label": "第一层 · 是什么", "text": "17—18世纪，法国耶稣会士白晋（Joachim Bouvet）把《易经》的卦图寄给莱布尼茨，并提示“伏羲六十四卦”与二进制（0/1）可能相通。莱布尼茨大为震动，认为中国古人早已洞悉二进制的秘密。", "refs": [45, 46]}, {"label": "第二层 · 为什么", "text": "但考据表明，莱布尼茨在接触卦图之前已独立发明了二进制。所以更准确的判断是：《易经》的阴阳符号与二进制在结构上“同构”，这启发了莱布尼茨，但并非二进制的来源。", "refs": [47, 48]}, {"label": "第三层 · 凭什么（本质）", "text": "这段公案的真正价值，不在于“谁发明了谁”，而在于它揭示了《易经》“关联式思维”（类比、同构）的科学潜力：用最简的二元符号去编码复杂世界，这与现代信息科学的精神惊人地相通。它也开启了近现代“科学易”的研究传统。", "refs": [28, 49]}]}, {"q": "荣格为什么痴迷《易经》？——它如何进入心理学？", "hint": "一位心理学大师，把一本中国古书当作“无意识的镜子”。", "layers": [{"label": "第一层 · 是什么", "text": "瑞士心理学家荣格（C.G. Jung）对《易经》推崇备至，为其英译本（卫礼贤译）作序，并提出著名的“共时性（synchronicity）”概念——某些事件之间存在着“有意义的巧合”，而非因果联系。", "refs": [50, 51]}, {"label": "第二层 · 为什么", "text": "荣格认为，占筮（如掷硬币成卦）之所以“灵验”，是因为它借助随机过程，把询问者无意识的心理状态“投射”到卦象上——卦象成了照见内心的镜子。这为占卜提供了一种心理学解释。", "refs": [52, 53]}, {"label": "第三层 · 凭什么（本质）", "text": "更深远的影响在于，荣格从《易经》那里借来了“整体性”与“自性化”的智慧，来对抗西方“主客二分”“因果决定”的思维惯性。可以说，《易经》帮助现代心理学打开了一扇通往“整体思维”的门。", "refs": [54, 55]}]}, {"q": "一部古经，如何衍生出管理、经济、美学、法律的智慧？", "hint": "从董事会到画案，从合同到战场，都有“易”的影子。", "layers": [{"label": "第一层 · 是什么", "text": "《易经》的思想被广泛“移植”到各实践领域：管理学提出“易经领导力模型”“中道管理”；经济学借“噬嗑”卦谈营销本质；美学谈“象外之象”；法律文化谈“刑与德”；还有军事、医学、建筑（风水）等。", "refs": [56, 57, 58]}, {"label": "第二层 · 为什么", "text": "这种“泛化”之所以可能，是因为《易经》提供的是一套元理论——关于“变化、时位、阴阳、平衡”的抽象原理，可被任何具体领域“实例化”。例如“中道”“时中”可转化为管理上的“权变”“动态平衡”。", "refs": [59, 60]}, {"label": "第三层 · 凭什么（本质）", "text": "但也要警惕过度附会。学术上对“管理易”“科学易”评价不一：赞者视之为“中国式管理智慧的本土资源”，疑者视为“泛易化”的穿凿。理性的态度是——把《易经》当作“启发式框架”，而非“万能公式”。", "refs": [61, 62]}]}]}, {"key": "C", "name": "语境重构", "en": "Context Reframing", "tagline": "定义贡献", "glyph": "☵", "color": "#4a3f7a", "questions": [{"q": "《易经》如何完成“从巫术到哲学”的飞跃，定义中国哲学的开端？", "hint": "这一步，是理解“中国为什么是中国”的关键。", "layers": [{"label": "第一层 · 是什么", "text": "春秋战国时期，诸子开始用理性重新诠释《易经》——最集中的成果便是《易传》。它把“天”从人格神升华为“形上之天”，把占卜转化为“推天道以明人事”的哲学。", "refs": [10, 5]}, {"label": "第二层 · 为什么", "text": "《易传》提炼出一套宇宙—人生同构的学说：“一阴一阳之谓道”“生生之谓易”“天行健，君子以自强不息；地势坤，君子以厚德载物”。它把自然规律与人的德行贯通起来，确立了中国哲学的“天人合一”底色。", "refs": [12, 63]}, {"label": "第三层 · 凭什么（本质）", "text": "正因如此，杨国荣等学者称《周易》为“中国哲学的开端”。它完成了一次“语境重构”：同样的卦爻辞，从“占断吉凶”的巫术语境，被整体移入“穷理尽性以至于命”的哲学语境——文本未变，意义焕然一新。", "refs": [22, 19]}]}, {"q": "一部中国古经，如何成为“世界之书”？——西传与汉学", "hint": "它比你想的更早“出海”，而且一路都是传奇。", "layers": [{"label": "第一层 · 是什么", "text": "《易经》的西传始于明末清初的耶稣会士：从利玛窦到白晋、傅圣泽，他们用“索隐派（Figurism）”的立场，试图在《易经》里“读出”基督教的真理，以此调和耶儒。", "refs": [64, 65]}, {"label": "第二层 · 为什么", "text": "19世纪以后，《易经》被理雅各、卫礼贤等译成英、德文，卫礼贤译本经荣格作序、贝恩斯转译，在西方产生巨大影响；20世纪它更进入文学（黑塞、博尔赫斯）、音乐、电影、心理学。西方对它的理解，经历了从“索隐神学”到“智慧之书”再到“历史语境之书”的范式转变。", "refs": [66, 67]}, {"label": "第三层 · 凭什么（本质）", "text": "《易经》的全球化是一个双向的“语境重构”：西方不断用它来映照、疗愈自身的现代性困境（如荣格、黑塞），而中国也借“西人的眼睛”重新发现了自己经典的普世价值。它成了中西对话中一座常读常新的桥梁。", "refs": [68, 69]}]}, {"q": "今天，我们为什么还要读《易经》？——一部“存养心智的大语言模型”", "hint": "把三千年的古经，比作今天的 AI，是不是太狂了？", "layers": [{"label": "第一层 · 是什么", "text": "有当代学者提出一个极具张力的说法：《易经》可以视为一部“存养心智的大语言模型”——它用极简的符号与卦爻辞，训练中国人三千年的“思维操作系统”，教人如何在不确定中决策、在变化中安身。", "refs": [70]}, {"label": "第二层 · 为什么", "text": "这个类比并非戏言：和今天的大语言模型一样，《易经》的价值不在“给出唯一正确答案”，而在于提供一个高度压缩、可组合、可生成的意义系统——六十四卦就是它的“提示词库”，“玩辞观象”就是它的“推理”。", "refs": [70, 71]}, {"label": "第三层 · 凭什么（本质）", "text": "在算法与焦虑并行的时代，《易经》提供的恰恰是 AI 给不了的东西：一种面对不确定性的从容——“乐天知命故不忧”，一种在变化中守住定力的智慧——“不易”之下的“变易”。读懂它，就是读懂中国人“在变局中安身立命”的底层代码。", "refs": [72, 73]}]}]}], "refs": {"nav": "参考文献", "title": "参考文献", "note": "以下 73 条均为真实学术文献（检索自中国知网 CNKI），按引用先后编排；卡片中 [n] 可点击跳转对应条目。", "items": [{"id": 1, "cite": "史善刚.数字易卦与易经[J].齐鲁学刊,2006,(6):5-9."}, {"id": 2, "cite": "刘保贞.从卦爻辞的内容看其性质[J].周易研究,2006,(4):54-60."}, {"id": 3, "cite": "郑吉雄.论《易经》非占筮记录[J].周易研究,2012,(2):24-32."}, {"id": 4, "cite": "姜广辉.《易经》:从“鬼谋”到“人谋”[J].湖南大学学报(社会科学版),2011,25(5):14-23."}, {"id": 5, "cite": "于民雄.从巫术到哲学:《易传》对《易经》的突破[J].贵州社会科学,2004,(6):58-60+54."}, {"id": 6, "cite": "张春津.《易经》书名辨析[J].理论与现代化,2015,(3):81-84."}, {"id": 7, "cite": "王汐朋.周易、易经书名辨正[J].福建论坛(人文社会科学版),2011,(9):58-61."}, {"id": 8, "cite": "吴钧.论易之“三易”与《易经》英译之“三难”[J].周易研究,2016,(4):72-80."}, {"id": 9, "cite": "杨晖,胡艺丹.试论《易经》的“变易”观念[J].船山学刊,2011,(1):58-60."}, {"id": 10, "cite": "赵敏俐.《易传》对经本体的理论提升及意义[J].中国社会科学院大学学报,2025,45(11):35-53+171-172+177."}, {"id": 11, "cite": "姜广辉,吴国龙.《易传》解《易》方法析论[J].周易研究,2016,(3):20-29."}, {"id": 12, "cite": "杨国荣.作为中国哲学开端的《周易》[J].中国哲学史,2025,(1):5-17+39."}, {"id": 13, "cite": "陈隆予.论《易经》被尊为群经之首的历史动因[J].河南大学学报(社会科学版),2010,50(4):22-26."}, {"id": 14, "cite": "张文修,刘国鹏.《周易》中的哲学问题[J].国际儒学(中英文),2025,5(4):1-12+197."}, {"id": 15, "cite": "毛朝晖.论“五经”在朱子理学建构中的地位[J].中州学刊,2024,(7):117-126."}, {"id": 16, "cite": "张志宏.论《周易》事功旨趣下“主体性”的张扬[J].中国哲学史,2024,(4):21-29."}, {"id": 17, "cite": "李书有,伍玲玲.《易经》在中华文化中的地位及影响——2000年世界易经大会回顾与展望[J].江苏社会科学,2001,(1):43-48."}, {"id": 18, "cite": "苏杉杉.自然宗教？还是伦理宗教？——《易经》宗教观再议[J].周易研究,2026,(3):56-65."}, {"id": 19, "cite": "黄玉顺.《易经》“天”“帝”超越意义的诠释[J] const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// header
$('#h1').textContent = DATA.title;
$('#hsub').textContent = DATA.subtitle;
$('#bagua').textContent = DATA.hero.bagua;
$('#heroTitle').textContent = DATA.hero.title;
$('#heroLead').textContent = DATA.hero.lead;
$('#refsTitle').textContent = DATA.refs.title;
$('#refsNote').textContent = DATA.refs.note;
$('#foot').innerHTML = DATA.footer;

// nav
$('#nav').innerHTML =
  DATA.acts.map(a=>`<a href="#act-${a.key}" data-k="${a.key}">${esc(a.glyph)} ${esc(a.name)}</a>`).join('') +
  `<a class="refs" href="#refsSec">📚 ${esc(DATA.refs.nav)}</a>`;

// epic chips
$('#epicChips').innerHTML = DATA.acts.map(a=>
  `<span class="epic-chip" style="background:${a.color}"><b>${esc(a.key)}</b>${esc(a.name)} · ${esc(a.tagline)}</span>`).join('');
$('#epicFlow').textContent = DATA.hero.flow;

// acts
$('#acts').innerHTML = DATA.acts.map((a,ai)=>{
  const qs = a.questions.map((q,qi)=>{
    const gid = `q-${ai}-${qi}`;
    const layers = q.layers.map((L,li)=>{
      const refs = L.refs.map(r=>`<a href="#ref-${r}">[${r}]</a>`).join('');
      return `<div class="layer depth${li+1}" id="${gid}-l${li}">
        <div class="lbl"><span class="dot"></span>${esc(L.label)}</div>
        <p>${esc(L.text)}</p>
        ${refs?`<div class="refs">文献：${refs}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="dig" id="${gid}">
      <div class="dig-top">
        <div class="qno"><span class="bar" style="background:${a.color}"></span>第 ${ai+1} 幕 · 第 ${qi+1} 问</div>
        <div class="q">${esc(q.q)}</div>
        ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}
      </div>
      <button class="dig-btn" id="${gid}-btn" onclick="dig('${gid}')">🔍 开始挖掘</button>
      <div class="layers">${layers}</div>
    </div>`;
  }).join('');
  return `<section class="act" id="act-${a.key}">
    <div class="act-head" style="background:${a.color}">
      <span class="glyph">${esc(a.glyph)}</span>
      <div class="meta"><b>${esc(a.name)}</b><span class="en">${esc(a.en)}</span></div>
      <span class="tagline">${esc(a.tagline)}</span>
    </div>
    ${qs}
  </section>`;
}).join('');

// references
$('#refsList').innerHTML = DATA.refs.items.map(r=>
  `<li id="ref-${r.id}"><span class="rid">[${r.id}]</span><span class="cite">${esc(r.cite)}</span></li>`).join('');

// dig interaction
function dig(gid){
  const root = document.getElementById(gid);
  const btn = document.getElementById(gid+'-btn');
  const layers = root.querySelectorAll('.layer');
  let shown = root.querySelectorAll('.layer.show').length;
  if(shown === 0){
    layers[0].classList.add('show');
    btn.textContent = '再深一层 ↓';
    btn.setAttribute('onclick', `dig('${gid}')`);
  } else if(shown < layers.length){
    layers[shown].classList.add('show');
    if(shown+1 === layers.length){ btn.textContent = '已抵达本质'; btn.disabled = true; }
    else btn.textContent = '再深一层 ↓';
  }
}

// scroll-spy for nav
const navLinks = document.querySelectorAll('#nav a[data-k]');
const actEls = [...document.querySelectorAll('.act')];
const spy = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const k = e.target.id.replace('act-','');
      navLinks.forEach(a=>a.classList.toggle('on', a.dataset.k===k));
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});
actEls.forEach(el=>spy.observe(el));
</script>
